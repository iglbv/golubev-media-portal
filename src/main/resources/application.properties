spring.application.name=media-portal
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media_portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:media}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:media}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
